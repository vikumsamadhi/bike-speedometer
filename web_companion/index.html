<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BikeSpeedo - Phone GPS & BLE Transmitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">🚲 BIKE SPEEDO</div>
            <div class="device-status" id="deviceStatus">BLE: DISCONNECTED</div>
        </header>

        <!-- Speed Display -->
        <main class="speed-card">
            <div class="speed-value" id="speedDisplay">0.0</div>
            <div class="speed-unit">km/h</div>
            <div class="gps-badge" id="gpsBadge">GPS: WAITING FIX</div>
        </main>

        <!-- Diagnostics & Metrics -->
        <section class="metrics-grid">
            <div class="metric-box">
                <span class="metric-label">Accuracy</span>
                <span class="metric-val" id="gpsAccuracy">-- m</span>
            </div>
            <div class="metric-box">
                <span class="metric-label">Max Speed</span>
                <span class="metric-val" id="maxSpeed">0.0 km/h</span>
            </div>
            <div class="metric-box">
                <span class="metric-label">Packets Sent</span>
                <span class="metric-val" id="packetCount">0</span>
            </div>
            <div class="metric-box">
                <span class="metric-label">Distance</span>
                <span class="metric-val" id="tripDistance">0.00 km</span>
            </div>
        </section>

        <!-- Controls -->
        <footer class="controls">
            <button id="connectBleBtn" class="btn btn-primary">Connect ESP32 (BLE)</button>
            <button id="toggleGpsBtn" class="btn btn-secondary">Start GPS Tracking</button>
            <div class="sim-toggle-row">
                <label for="simCheckbox">Desk Simulation Mode (Test slider without outdoor GPS):</label>
                <input type="checkbox" id="simCheckbox">
            </div>
            <div id="simControls" class="sim-slider-container" style="display: none;">
                <input type="range" id="simSpeedSlider" min="0" max="60" value="15" step="0.5">
                <span id="simSpeedVal">15.0 km/h</span>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
